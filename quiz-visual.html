<head>

<title>Quiz 317 câu cần xem hình GPLX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  .bar {
    flex: none; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center;
    padding: clamp(6px, 1.4dvh, 12px) 16px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  .bar button, .bar label.tog {
    font-size: 0.95rem; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 10px; cursor: pointer;
  }
  .bar label.tog { display: inline-flex; gap: 6px; align-items: center; }
  .stat { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); }
  .progress { width: clamp(90px, 18vw, 200px); height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); }

  main { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; padding: clamp(8px, 2dvh, 24px) 16px; }
  .card {
    width: 100%; max-width: 1000px; margin: auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: clamp(14px, min(3.2vw, 3.6dvh), 36px);
  }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: clamp(8px, 1.8dvh, 16px); }
  .chip { font-size: 0.85rem; font-weight: 600; padding: 4px 10px; border-radius: 3px; background: var(--accent-soft); color: var(--accent); }
  .chip.plain { background: var(--bg); color: var(--muted); }
  /* Câu điểm liệt dùng màu hổ phách để không lẫn với viền đỏ = trả lời sai */
  .card.critical { box-shadow: inset 5px 0 0 var(--warn); border-color: var(--warn); }
  .chip.critical { background: var(--warn); color: var(--on-accent); letter-spacing: .04em; text-transform: uppercase; }

  .question {
    font-size: calc(clamp(1.15rem, min(1.1rem + 1.7vw, 0.3rem + 3.3dvh), 2.15rem) * var(--k, 1)); font-weight: 600; line-height: 1.4;
    margin: 0 0 clamp(10px, 2.2dvh, 20px); letter-spacing: -0.005em;
  }
  .images { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center; margin: 0 0 clamp(10px, 2.4dvh, 22px); }
  .images img {
    max-width: 100%; max-height: calc(clamp(110px, 34dvh, 340px) * var(--k, 1)); object-fit: contain;
    background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 6px;
  }
  .images.multi img { max-width: calc(50% - 7px); max-height: calc(clamp(90px, 26dvh, 260px) * var(--k, 1)); }
  /* Hình dọc: cột phải, ngang hàng câu hỏi */
  .card.side {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: clamp(16px, 3vw, 32px);
    grid-template-areas: "meta meta" "q img" "opts opts"; align-content: start;
  }
  .card.side .meta { grid-area: meta; }
  .card.side .question { grid-area: q; }
  .card.side .images { grid-area: img; align-self: start; margin: 0 0 clamp(10px, 2.2dvh, 20px); }
  .card.side .images img { max-height: calc(clamp(110px, 25dvh, 240px) * var(--k, 1)); max-width: clamp(100px, 16vw, 190px); }
  .card.side .options { grid-area: opts; }

  .options { display: grid; gap: clamp(8px, 1.4dvh, 12px); grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr)); }
  .opt {
    display: flex; gap: 12px; align-items: center; text-align: left; width: 100%;
    padding: calc(clamp(8px, 1.8dvh, 14px) * var(--k, 1)) 16px;
    border: 2px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer;
    font-size: calc(clamp(1.05rem, min(1rem + 0.55vw, 0.35rem + 2.1dvh), 1.4rem) * var(--k, 1) * var(--ofs, 1)); line-height: 1.4;
    transition: opacity .15s, border-color .15s, background .15s;
  }
  .opt:hover:not(.locked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt.locked { cursor: default; }
  .opt .num {
    flex: none; width: 2.1em; height: 2.1em; display: grid; place-items: center; border-radius: 3px;
    background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 0.9em;
  }
  .opt .txt { flex: 1; }
  .opt .mark { flex: none; font-weight: 700; font-size: 0.9em; }
  .opt.dim { opacity: .5; }
  .opt.is-correct { border-color: var(--ok); background: var(--ok-soft); font-weight: 600; opacity: 1; }
  .opt.is-correct .num { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
  .opt.is-correct .mark { color: var(--ok); }
  .opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); opacity: 1; }
  .opt.is-wrong .num { background: var(--bad); border-color: var(--bad); color: var(--on-accent); }
  .opt.is-wrong .mark { color: var(--bad); }
  .note { margin-top: clamp(8px, 1.6dvh, 14px); text-align: center; font-weight: 600; color: var(--muted); }
  .note.bad { color: var(--bad); } .note.ok { color: var(--ok); }

  .nav {
    flex: none; display: flex; gap: 12px; justify-content: center; padding: clamp(8px, 1.6dvh, 14px) 16px;
    background: var(--card); border-top: 1px solid var(--line);
  }
  .nav[hidden] { display: none; }
  .nav button {
    font-weight: 600; font-size: 1rem; padding: 10px 20px; border-radius: 4px; min-width: 120px;
    border: 1px solid var(--line); background: var(--card); cursor: pointer;
  }
  .nav button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .nav button.submit { border-color: var(--bad); color: var(--bad); }
  .nav button:disabled { opacity: .4; cursor: default; }

  /* Màn hình cài đặt & kết quả */
  .panel { width: 100%; max-width: 560px; margin: auto; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 28px; }
  .panel h1 { margin: 0 0 6px; font-size: 1.6rem; }
  .panel p.sub { margin: 0 0 20px; color: var(--muted); }
  .field { display: grid; gap: 6px; margin-bottom: 16px; font-weight: 600; }
  .field select { padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-weight: 400; }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
  .btn { padding: 12px 20px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
  .score { border: 1px solid var(--line); border-radius: 4px; padding: 14px 8px; text-align: center; background: var(--bg); }
  .score b { display: block; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .score span { color: var(--muted); font-size: 0.9rem; }
  .score.ok { border-color: var(--ok); } .score.ok b { color: var(--ok); }
  .score.bad { border-color: var(--bad); } .score.bad b { color: var(--bad); }
  .bigpct { text-align: center; font-size: 1.1rem; color: var(--muted); }
  .bigpct strong { font-size: 2.4rem; color: var(--ink); }
  .stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); margin: 8px 0 0; }
  .stack i:nth-child(1) { background: var(--ok); } .stack i:nth-child(2) { background: var(--bad); }
  .warnbox { border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 12px 14px; margin-bottom: 14px; font-weight: 600; }
  .wronglist { max-height: 28dvh; overflow-y: auto; border: 1px solid var(--line); border-radius: 4px; margin: 12px 0; }
  .wronglist button { display: flex; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--card); cursor: pointer; }
  .wronglist button:last-child { border-bottom: 0; }
  .wronglist button:hover { background: var(--accent-soft); }
  .wronglist .st { flex: none; font-weight: 700; width: 5.4em; white-space: nowrap; }
  .wronglist .st.bad { color: var(--bad); } .wronglist .st.blank { color: var(--muted); }
  .wronglist .pr { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  dialog { border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); padding: 20px; max-width: min(560px, 92vw); }
  dialog::backdrop { background: var(--backdrop); }
  dialog h2 { margin: 0 0 10px; font-size: 1.2rem; }
  /* Drawer bên phải: chọn câu + trạng thái đúng/sai */
  #scrim { position: fixed; inset: 0; background: var(--backdrop); z-index: 19; }
  #drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); z-index: 20;
    display: flex; flex-direction: column; background: var(--card); border-left: 1px solid var(--line);
    transform: translateX(100%); visibility: hidden; transition: transform .2s ease, visibility 0s .2s;
  }
  #drawer.open { transform: none; visibility: visible; transition: transform .2s ease; }
  .dr-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .dr-head h2 { margin: 0; font-size: 1.1rem; }
  .dr-head button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
  .dr-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 16px 0; }
  .dr-sum div { border: 1px solid var(--line); border-radius: 4px; padding: 8px 4px; text-align: center; font-size: 0.8rem; color: var(--muted); }
  .dr-sum b { display: block; font-size: 1.4rem; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  .dr-sum .ok { border-color: var(--ok); } .dr-sum .ok b { color: var(--ok); }
  .dr-sum .bad { border-color: var(--bad); } .dr-sum .bad b { color: var(--bad); }
  .dr-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
  .dr-filters button { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
  .dr-filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .dr-grid { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: grid; align-content: start;
             grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .dr-grid button { position: relative; padding: 9px 0; border: 2px solid var(--line); border-radius: 4px; background: var(--bg); font-weight: 600; cursor: pointer; }
  .dr-grid button.c { border-color: var(--ok); background: var(--ok-soft); }
  .dr-grid button.w { border-color: var(--bad); background: var(--bad-soft); }
  .dr-grid button.cur { outline: 3px solid var(--accent); outline-offset: 1px; }
  .dr-grid button.crit::after { content: ""; position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .dr-legend { padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .dr-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 2px solid var(--line); }
  .dr-legend i.c { border-color: var(--ok); background: var(--ok-soft); } .dr-legend i.w { border-color: var(--bad); background: var(--bad-soft); }
  .dr-legend i.k { border: 0; border-radius: 50%; background: var(--warn); width: 8px; height: 8px; }
  .dlg-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  .dlg-actions button { padding: 9px 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--card); font-weight: 600; cursor: pointer; }
  .dlg-actions .primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  @media (max-height: 640px) { .meta .plain { display: none; } .opt { padding-block: 6px; } .images img { max-height: 24dvh; } }
  @media (max-width: 640px) {
    .options { grid-template-columns: 1fr !important; }
    .images.multi img { max-width: 100%; }
    .card.side { display: block; }
    .card.side .images { margin-bottom: 14px; }
    .card.side .images img { max-width: 100%; max-height: clamp(110px, 30dvh, 260px); }
    .nav button { min-width: 0; flex: 1; padding-inline: 10px; }
  }
</style>
</head>

// ---------- âm thanh hiệu ứng (Web Audio API) ----------
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
  return audioCtx;
}

function playSound(isCorrect) {
  if (S && S.sound === false) return;
  try {
    const ctx = getAudioContext();
    if (!ctx) return;
    const now = ctx.currentTime;
    if (isCorrect) {
      // Chuông nhẹ nhàng 2 nốt (C5 523Hz -> E5 659Hz)
      [523.25, 659.25].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, now + i * 0.09);
        gain.gain.setValueAtTime(0, now + i * 0.09);
        gain.gain.linearRampToValueAtTime(0.12, now + i * 0.09 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.28);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.09);
        osc.stop(now + i * 0.09 + 0.3);
      });
    } else {
      // Âm trầm êm ái khi sai (280Hz -> 190Hz)
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(190, now + 0.25);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.09, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }
  } catch {}
}

}

function columnsFor(options) {
  const n = options.length, longest = Math.max(...options.map((o) => o.text.length));
  if (n >= 2 && n <= 4 && longest <= { 2: 40, 3: 26, 4: 14 }[n]) return { cols: n, short: true };
  if (n % 2 === 0 && longest <= 70) return { cols: 2, short: false };
  return { cols: 1, short: false };
}
function fitColumns(c) {
  const box = c.querySelector(".options"); if (!box) return;
  let cols = +box.dataset.cols;
  box.style.setProperty("--cols", cols); box.style.setProperty("--ofs", 1);
  const wraps = () => [...box.querySelectorAll(".opt .txt")]
    .some((t) => t.getBoundingClientRect().height > parseFloat(getComputedStyle(t).lineHeight) * 1.5);
  if ("short" in box.dataset) {
    while (cols > 1 && wraps()) { cols = cols === 4 ? 2 : 1; box.style.setProperty("--cols", cols); }
  } else if (cols === 2) {
    let f = 1;
    while (wraps() && f > 0.92) { f = +(f - 0.04).toFixed(2); box.style.setProperty("--ofs", f); }
    if (wraps()) { box.style.setProperty("--ofs", 1); box.style.setProperty("--cols", 1); }
  }
}
function fit() {
  const c = $("#card"); if (!c) return;

  let k = 1;
  while (c.offsetHeight > room && k > 0.88) { k = +(k - 0.04).toFixed(2); c.style.setProperty("--k", k); }
}

// ---------- các màn hình ----------
function renderSetup() {
  view = "setup"; setDrawer(false);
  $("#bar").innerHTML = '<strong>Quiz 317 câu cần xem hình GPLX</strong>' + (S && !S.submitted ? ` <button data-act="resume" style="margin-left:auto;font-weight:600;color:var(--accent)">▶ Tiếp tục câu ${S.idx + 1}</button>` : "");
  $("#nav").hidden = true;
  const left = S && !S.submitted ? S.order.length - Object.keys(S.answers).length : 0;
  $("#app").innerHTML = `
    <div class="panel">
      <h1>Làm bài quiz</h1>
      <p class="sub">Chọn đáp án để biết đúng/sai ngay. Bấm Nộp bài để xem tổng kết.</p>
      ${S && !S.submitted ? `<button class="btn primary" data-act="resume">Tiếp tục bài đang làm (câu ${S.idx + 1} · còn ${left}/${S.order.length} câu)</button><hr style="margin:18px 0;border:0;border-top:1px solid var(--line)">` : ""}
      <label class="field">Phạm vi
        <select id="optScope">
          <option value="all">Tất cả 317 câu</option>
          <option value="critical">Chỉ câu điểm liệt</option>
          ${Object.entries(CHAPTERS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}
        </select></label>
      <label class="field">Số câu
        <select id="optCount">
          ${[20, 35, 50, 100].map((n) => `<option value="${n}">${n} câu</option>`).join("")}
          <option value="0">Tất cả trong phạm vi</option>
        </select></label>
      <label class="check"><input type="checkbox" id="optShuffle" checked> Xáo trộn thứ tự câu hỏi</label>
      <label class="check"><input type="checkbox" id="optNoMoto" ${skipMoto() ? "checked" : ""}> Bỏ câu chỉ dành cho xe mô tô (${QUESTIONS.filter((q) => MOTO_ONLY.has(q.id)).length} câu)</label>
      <button class="btn ${S && !S.submitted ? "" : "primary"}" data-act="start">Bắt đầu bài mới</button>
    </div>`;
}

function renderQuestion() {
  view = "quiz";
  const q = cur(), st = stats(), locked = isLocked(q), chosen = S.answers[q.id];
  const done = st.total - st.blank;
  $("#bar").innerHTML = `
    <button data-act="home" title="Quay về menu chọn bài">🏠 Menu</button>
    <span class="stat">Câu ${S.idx + 1} / ${st.total}</span>
    <span class="progress" title="Đã trả lời ${done}/${st.total}"><i style="width:${(done / st.total) * 100}%"></i></span>
    <span class="stat">Đã làm ${done}/${st.total}</span>
    <button data-act="palette">Danh sách câu</button>
    ${S.submitted ? "" : `
      <label class="tog"><input type="checkbox" id="auto" ${S.auto !== false ? "checked" : ""}> Tự chuyển câu</label>
      <label class="tog"><input type="checkbox" id="sound" ${S.sound !== false ? "checked" : ""}> Âm thanh</label>`}
    ${S.submitted ? '<span class="stat">Chế độ xem lại</span>' : ""}`;

  const side = q.images.length === 1 && q.images[0].height > q.images[0].width * 1.15;
  const { cols, short } = side ? { cols: 1, short: false } : columnsFor(q.options);
  const imgs = q.images.length
    ? `<div class="images ${q.images.length > 1 ? "multi" : ""}">${q.images
        .map((i) => `<img src="${i.file}" alt="Hình minh họa câu ${q.id}" onload="fit()">`).join("")}</div>` : "";
  const opts = q.options.map((o) => {
    let cls = "";
    if (locked) {
      cls = "locked ";
      if (o.id === q.pdf_correct_option) cls += "is-correct";
      else if (o.id === chosen) cls += "is-wrong";
      else cls += "dim";
    }
    const mark = locked ? (o.id === q.pdf_correct_option ? "✓ Đúng" : o.id === chosen ? "✗ Bạn chọn" : "") : "";
    return `<button class="opt ${cls}" data-act="pick" data-id="${o.id}" ${locked ? 'aria-disabled="true"' : ""}>
      <span class="num">${o.id}</span><span class="txt">${esc(o.text)}</span>${mark ? `<span class="mark">${mark}</span>` : ""}</button>`;
  }).join("");
  let note = "";
  if (locked) {
    if (chosen === undefined) note = '<div class="note">Bạn chưa trả lời câu này.</div>';
    else if (chosen === q.pdf_correct_option) note = '<div class="note ok">Chính xác!</div>';
    else note = `<div class="note bad">Chưa đúng — đáp án đúng là ${q.pdf_correct_option}.</div>`;
  }
  $("#app").innerHTML = `
    <div class="card ${side ? "side" : ""} ${q.critical ? "critical" : ""}" id="card">
      <div class="meta">
        <span class="chip">Câu ${S.idx + 1}</span>
        ${q.critical ? '<span class="chip critical">⚠ Câu điểm liệt</span>' : ""}
        <span class="chip plain">${CHAPTERS[q.chapter] || ""} · câu ${q.id} của bộ 600</span>
      </div>
      <h1 class="question">${esc(q.prompt)}</h1>
      ${imgs}
      <div class="options" style="--cols:${cols}" data-cols="${cols}" ${short ? "data-short" : ""}>${opts}</div>
      ${note}
    </div>`;
  const nav = $("#nav");
  nav.hidden = false;
  nav.innerHTML = `
    <button data-act="prev" ${S.idx === 0 ? "disabled" : ""}>← Trước</button>
    ${S.submitted ? '<button data-act="result">Kết quả</button>' : '<button class="submit" data-act="submit">Nộp bài</button>'}
    <button class="primary" data-act="next" ${S.idx >= st.total - 1 ? "disabled" : ""}>Sau →</button>`;
  $("#app").scrollTo({ top: 0 });
  fit();
  renderDrawer();
}

function renderResult() {
  view = "result"; setDrawer(false);
  const st = stats(), pct = Math.round((st.correct / st.total) * 100);
  const bad = S.order.map((id, i) => ({ q: BY_ID.get(id), i, a: S.answers[id] }))
    .filter((x) => x.a !== x.q.pdf_correct_option);
  $("#bar").innerHTML = '<strong>Kết quả bài làm</strong>';
  $("#nav").hidden = true;
  const critTotal = st.critWrong + st.critBlank;
  $("#app").innerHTML = `
    <div class="panel">
      <h1>Đã nộp bài</h1>
      <div class="bigpct"><strong>${st.correct}/${st.total}</strong> câu đúng · ${pct}%</div>
      <div class="stack"><i style="width:${(st.correct / st.total) * 100}%"></i><i style="width:${(st.wrong / st.total) * 100}%"></i></div>
      <div class="scores">
        <div class="score ok"><b>${st.correct}</b><span>Đúng</span></div>
        <div class="score bad"><b>${st.wrong}</b><span>Sai</span></div>
        <div class="score"><b>${st.blank}</b><span>Chưa trả lời</span></div>
      </div>
      ${critTotal ? `<div class="warnbox">⚠ ${critTotal} câu điểm liệt chưa đúng (${st.critWrong} sai, ${st.critBlank} chưa trả lời). Sai câu điểm liệt là bị đánh giá không đạt trong kỳ sát hạch.</div>` : ""}
      ${bad.length ? `<strong>Các câu cần xem lại (${bad.length})</strong>
        <div class="wronglist">${bad.map((x) => `
          <button data-act="goto" data-i="${x.i}">
            <span class="st ${x.a === undefined ? "blank" : "bad"}">${x.a === undefined ? "Bỏ trống" : "Sai"}</span>
            <span class="pr">Câu ${x.i + 1}${x.q.critical ? " ⚠" : ""} · ${esc(x.q.prompt)}</span>
          </button>`).join("")}</div>` : '<p class="sub">Bạn trả lời đúng tất cả các câu. Rất tốt!</p>'}
      <button class="btn primary" data-act="goto" data-i="0">Xem lại từng câu</button>
      ${bad.length ? '<button class="btn" data-act="retry">Làm lại các câu chưa đúng</button>' : ""}
      <button class="btn" data-act="new">Bài mới</button>
    </div>`;
}

// ---------- hành động ----------
function startQuiz(ids) {
  clearTimeout(autoTimer);
  S = {
    order: ids,
    answers: {},
    idx: 0,
    submitted: false,
    auto: S && typeof S.auto === "boolean" ? S.auto : true,
    sound: S && typeof S.sound === "boolean" ? S.sound : true
  };
  save(); renderQuestion();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pick(id) {
  const q = cur();
  if (isLocked(q)) return;
  const isCorrect = id === q.pdf_correct_option;
  playSound(isCorrect);
  S.answers[q.id] = id; save(); renderQuestion();
  if (S.auto !== false && S.idx < S.order.length - 1) {
    const at = S.idx;
    clearTimeout(autoTimer);
    autoTimer = setTimeout(() => { if (S && S.idx === at && view === "quiz") go(at + 1); }, isCorrect ? 600 : 1200);
  }
}
function go(i) {
  if (i < 0 || i >= S.order.length) return;
  clearTimeout(autoTimer); S.idx = i; save(); renderQuestion();
}
function openDialog(html, onClose) {
  const d = $("#dlg"); d.innerHTML = html; d.showModal();
  d.onclose = () => onClose && onClose(d.returnValue);
}
function submit() {
  const st = stats();
  const doSubmit = () => { S.submitted = true; save(); renderResult(); };
  if (!st.blank) return doSubmit();
  openDialog(`<form method="dialog"><h2>Nộp bài?</h2>
    <p>Còn <strong>${st.blank}</strong> câu chưa trả lời. Những câu này sẽ được tính là chưa trả lời.</p>
    <div class="dlg-actions"><button value="no">Làm tiếp</button><button class="primary" value="yes">Nộp bài</button></div></form>`,
    (v) => { if (v === "yes") doSubmit(); });
}
// ---------- drawer chọn câu ----------
let drawerOpen = false, drawerFilter = "all";
const FILTERS = { all: "Tất cả", wrong: "Sai", blank: "Chưa làm", critical: "Câu liệt" };
function statusOf(q) {
  const a = S.answers[q.id];
  return a === undefined ? "blank" : a === q.pdf_correct_option ? "correct" : "wrong";
}
function renderDrawer() {
  const d = $("#drawer");
  d.classList.toggle("open", drawerOpen);
  d.setAttribute("aria-hidden", !drawerOpen);
  $("#scrim").hidden = !drawerOpen;
  if (!drawerOpen || !S) return;
  const st = stats();
  const cells = S.order.map((id, i) => ({ q: BY_ID.get(id), i }))
    .filter(({ q }) => drawerFilter === "all" || (drawerFilter === "critical" ? q.critical : statusOf(q) === drawerFilter))
    .map(({ q, i }) => {
      const c = { correct: "c", wrong: "w", blank: "" }[statusOf(q)];
      const label = { correct: "đúng", wrong: "sai", blank: "chưa làm" }[statusOf(q)];
      return `<button class="${c} ${i === S.idx ? "cur" : ""} ${q.critical ? "crit" : ""}" data-act="jump" data-i="${i}"
        title="Câu ${i + 1}: ${label}${q.critical ? " · câu điểm liệt" : ""}">${i + 1}</button>`;
    }).join("");
  d.innerHTML = `
    <div class="dr-head"><h2>Danh sách câu</h2><button data-act="drawer-close" aria-label="Đóng">✕ Đóng</button></div>
    <div class="dr-sum">
      <div class="ok"><b>${st.correct}</b>Đúng</div><div class="bad"><b>${st.wrong}</b>Sai</div><div><b>${st.blank}</b>Chưa làm</div>
    </div>
    <div class="dr-filters">${Object.entries(FILTERS).map(([k, v]) =>
      `<button data-act="drawer-filter" data-f="${k}" aria-pressed="${drawerFilter === k}">${v}</button>`).join("")}</div>
    <div class="dr-grid">${cells || '<span style="grid-column:1/-1;color:var(--muted)">Không có câu nào.</span>'}</div>
    <div class="dr-legend"><span><i class="c"></i>Đúng</span><span><i class="w"></i>Sai</span><span><i></i>Chưa làm</span><span><i class="k"></i>Câu điểm liệt</span></div>`;
  d.querySelector(".cur")?.scrollIntoView({ block: "nearest" });
}
function setDrawer(open) { drawerOpen = open; renderDrawer(); }

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "start") {
    const doStart = () => {
      const scope = $("#optScope").value, count = +$("#optCount").value;
      let pool = QUESTIONS.filter((q) => scope === "all" || (scope === "critical" ? q.critical : q.chapter === scope));
      if ($("#optNoMoto").checked) pool = pool.filter((q) => !MOTO_ONLY.has(q.id));
      if ($("#optShuffle").checked) shuffle(pool);
      if (count) pool = pool.slice(0, count);
      startQuiz(pool.map((q) => q.id));
    };
    if (S && !S.submitted && Object.keys(S.answers).length > 0) {
      openDialog(`<form method="dialog"><h2>Bắt đầu bài mới?</h2>
        <p>Bạn đang làm dở một bài quiz (đã trả lời ${Object.keys(S.answers).length}/${S.order.length} câu). Bắt đầu bài mới sẽ xóa tiến trình bài này.</p>
        <div class="dlg-actions"><button value="no">Tiếp tục bài cũ</button><button class="primary" value="yes">Bắt đầu bài mới</button></div></form>`,
        (v) => { if (v === "yes") doStart(); else renderQuestion(); });
    } else {
      doStart();
    }
  }
  else if (act === "home") { clearTimeout(autoTimer); renderSetup(); }
  else if (act === "resume") renderQuestion();
  else if (act === "pick") pick(+t.dataset.id);
  else if (act === "prev") go(S.idx - 1);
  else if (act === "next") go(S.idx + 1);
  else if (act === "submit") submit();
  else if (act === "result") renderResult();
  else if (act === "palette") setDrawer(!drawerOpen);
  else if (act === "drawer-close") setDrawer(false);
  else if (act === "drawer-filter") { drawerFilter = t.dataset.f; renderDrawer(); }
  else if (act === "jump") { setDrawer(false); go(+t.dataset.i); }
  else if (act === "goto") { S.idx = +t.dataset.i; save(); renderQuestion(); }
  else if (act === "retry") {
    startQuiz(S.order.filter((id) => S.answers[id] !== BY_ID.get(id).pdf_correct_option));
  }
  else if (act === "new") { S = null; save(); renderSetup(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "auto") { S.auto = e.target.checked; save(); }
  else if (e.target.id === "sound") { S.sound = e.target.checked; save(); }
  else if (e.target.id === "optNoMoto") setSkipMoto(e.target.checked);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerOpen) { setDrawer(false); return; }
  if (view !== "quiz" || $("#dlg").open || ["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") go(S.idx + 1);
  else if (e.key === "ArrowLeft") go(S.idx - 1);
  else if (/^[1-9]$/.test(e.key) && cur().options.some((o) => o.id === +e.key)) pick(+e.key);
});

if (S) {
  if (S.submitted) renderResult();
  else renderQuestion();
} else {
  renderSetup();
}
</script>
</body>
</html>
