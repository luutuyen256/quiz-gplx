<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo đề thi tùy chỉnh · GPLX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  button, input, select { font: inherit; color: inherit; }
  button, a { -webkit-tap-highlight-color: transparent; }
  .page-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .home-link, .theme-toggle, .topbar button { flex: none; }
  .topbar h1 { min-width: 0; flex: 1; margin: 0; font-size: 1.05rem; line-height: 1.3; }
  .topbar h1 small { display: block; margin-top: 2px; color: var(--text-muted); font-size: .72rem; font-weight: 400; }
  .count-pill { flex: none; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); color: var(--accent-gold); font: 600 .78rem var(--font-mono); white-space: nowrap; }
  .theme-toggle { margin: 0; }
  main { width: min(1440px, 100%); margin: 0 auto; padding: 20px 16px 40px; }
  .builder-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .75fr); gap: 18px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .panel-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; padding: 18px 20px 12px; border-bottom: 1px solid var(--border-subtle); }
  .panel-head h2 { margin: 0; font-size: 1.05rem; }
  .panel-head p { margin: 4px 0 0; color: var(--text-muted); font-size: .82rem; }
  .search-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); }
  .search-box { position: relative; }
  .search-box input { width: 100%; padding: 12px 38px 12px 13px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); outline: none; }
  .search-box input:focus, select:focus { border-color: var(--accent-gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-gold) 22%, transparent); }
  .search-box span { position: absolute; top: 50%; right: 12px; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  select { min-width: 150px; padding: 11px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); }
  .results-meta { padding: 10px 20px 0; color: var(--text-muted); font-size: .78rem; }
  .results { display: grid; gap: 9px; max-height: calc(100vh - 250px); min-height: 260px; overflow: auto; padding: 12px 20px 20px; }
  .question-result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); }
  .question-result:hover { border-color: var(--accent-gold); }
  .question-no { min-width: 48px; color: var(--accent-gold); font: 600 .8rem var(--font-mono); }
  .question-copy { min-width: 0; }
  .question-copy p { margin: 0; line-height: 1.45; font-size: .92rem; }
  .question-copy small { display: block; margin-top: 6px; color: var(--text-muted); font-size: .74rem; }
  .critical-badge { display: inline-block; margin-left: 6px; padding: 2px 5px; border-radius: 3px; background: var(--warn-soft); color: var(--warn); font-size: .68rem; font-weight: 700; }
  .add-btn, .primary-btn, .ghost-btn, .danger-btn { border: 1px solid var(--border); border-radius: var(--radius-xs); padding: 9px 12px; background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
  .add-btn { color: var(--accent-gold); }
  .add-btn:hover:not(:disabled), .primary-btn:hover:not(:disabled), .ghost-btn:hover:not(:disabled), .danger-btn:hover:not(:disabled) { border-color: var(--accent-gold); background: var(--surface-hover); }
  button:disabled { cursor: default; opacity: .5; }
  .add-btn[aria-pressed="true"] { color: var(--ok); border-color: var(--ok); background: var(--ok-soft); }
  .primary-btn { border-color: var(--accent-gold); background: var(--accent-gold); color: var(--on-accent); }
  .danger-btn { color: var(--bad); }
  .selected-panel { position: sticky; top: 78px; }
  .selected-actions { display: flex; gap: 8px; align-items: center; }
  .selected-list { display: grid; gap: 8px; max-height: calc(100vh - 255px); overflow: auto; padding: 14px 20px 20px; }
  .selected-item { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 9px; align-items: start; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); }
  .selected-item .order { color: var(--accent-gold); font: 600 .78rem var(--font-mono); }
  .selected-item .text { min-width: 0; font-size: .82rem; line-height: 1.4; }
  .remove-btn { width: 28px; height: 28px; padding: 0; border: 1px solid var(--border); border-radius: 3px; background: transparent; cursor: pointer; }
  .empty-state { padding: 40px 24px; text-align: center; color: var(--text-muted); }
  .empty-state strong { display: block; margin-bottom: 6px; color: var(--text); }
  .notice { margin: 12px 20px 0; padding: 10px 12px; border: 1px solid var(--warn); border-radius: var(--radius-xs); background: var(--warn-soft); color: var(--warn); font-size: .82rem; }
  .builder-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 18px; border-top: 1px solid var(--border-subtle); }
  .builder-footer span { color: var(--text-muted); font-size: .8rem; }
  #examView, #resultView { display: none; }
  .exam-shell { width: min(900px, 100%); margin: 0 auto; }
  .exam-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .exam-progress { color: var(--text-muted); font: 600 .82rem var(--font-mono); }
  .exam-card { padding: clamp(18px, 3vw, 34px); }
  .exam-card h2 { margin: 0 0 22px; font-size: clamp(1.15rem, 1rem + 1vw, 1.7rem); line-height: 1.45; }
  .exam-images { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 0 0 18px; }
  .exam-images img { max-width: 100%; max-height: 300px; object-fit: contain; border: 1px solid var(--border); border-radius: var(--radius-xs); background: #fff; padding: 5px; }
  .exam-options { display: grid; gap: 10px; }
  .exam-option { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 13px; border: 2px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); text-align: left; cursor: pointer; }
  .exam-option:hover { border-color: var(--accent-gold); }
  .exam-option.selected { border-color: var(--accent-gold); background: var(--surface-hover); }
  .exam-option b { flex: none; width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 3px; font-size: .8rem; }
  .exam-option.selected b { background: var(--accent-gold); border-color: var(--accent-gold); color: var(--on-accent); }
  .exam-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .result-hero { padding: 28px; text-align: center; }
  .result-hero h2 { margin: 0 0 8px; }
  .result-score { margin: 10px 0 20px; font: 600 2.3rem var(--font-mono); color: var(--accent-gold); }
  .result-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .review-list { display: grid; gap: 8px; margin-top: 16px; }
  .review-item { padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius-xs); background: var(--surface-elevated); font-size: .84rem; }
  .review-item.ok { border-color: var(--ok); }
  .review-item.bad { border-color: var(--bad); }
  @media (max-width: 820px) {
    .builder-grid { grid-template-columns: 1fr; }
    .selected-panel { position: static; }
    .results, .selected-list { max-height: none; }
  }
  @media (max-width: 560px) {
    .topbar { padding-inline: 10px; gap: 7px; }
    .topbar h1 small { display: none; }
    .count-pill { padding-inline: 7px; font-size: .7rem; }
    main { padding-inline: 10px; }
    .panel-head, .search-tools, .results-meta, .results, .selected-list, .builder-footer { padding-left: 13px; padding-right: 13px; }
    .search-tools { grid-template-columns: 1fr; }
    .question-result { grid-template-columns: auto minmax(0, 1fr); }
    .question-result .add-btn { grid-column: 2; justify-self: start; }
    .selected-actions { flex-wrap: wrap; justify-content: flex-end; }
  }
</style>
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <a class="home-link" href="./">← Menu</a>
    <h1>Tạo đề thi tùy chỉnh<small>Tìm câu hỏi, thêm vào danh sách rồi bắt đầu bài thi</small></h1>
    <span class="count-pill" id="topCount">0 câu</span>
    <button class="theme-toggle" data-theme-toggle type="button"></button>
  </header>

  <main>
    <section id="builderView">
      <div class="builder-grid">
        <article class="panel">
          <div class="panel-head">
            <div><h2>Tìm câu hỏi</h2><p>Gõ số câu, từ khóa trong đề hoặc trong đáp án.</p></div>
          </div>
          <div class="search-tools">
            <label class="search-box"><input id="questionSearch" type="search" placeholder="Ví dụ: nồng độ cồn, xe tải, câu 120..." autocomplete="off"><span>⌕</span></label>
            <select id="chapterFilter" aria-label="Lọc theo chương"><option value="all">Tất cả chương</option><option value="critical">Câu điểm liệt</option></select>
          </div>
          <div class="results-meta" id="resultsMeta"></div>
          <div class="results" id="results"></div>
        </article>

        <aside class="panel selected-panel">
          <div class="panel-head">
            <div><h2>Đề đang chọn</h2><p id="selectionHint">Chưa có câu nào được thêm.</p></div>
            <div class="selected-actions"><button class="danger-btn" id="clearBtn" type="button" disabled>Xóa hết</button></div>
          </div>
          <div id="selectionNotice" class="notice" hidden></div>
          <div class="selected-list" id="selectedList"></div>
          <div class="builder-footer"><span id="footerCount">0/600 câu</span><button class="primary-btn" id="startBtn" type="button" disabled>Bắt đầu bài thi</button></div>
        </aside>
      </div>
    </section>

    <section id="examView" class="exam-shell">
      <div class="exam-top"><button class="ghost-btn" id="backToBuilderBtn" type="button">← Sửa danh sách</button><span class="exam-progress" id="examProgress"></span></div>
      <article class="panel exam-card" id="examCard"></article>
    </section>

    <section id="resultView" class="exam-shell">
      <article class="panel result-hero" id="resultHero"></article>
      <div class="panel" style="padding:18px 20px"><h3 style="margin:0">Xem lại bài làm</h3><div class="review-list" id="reviewList"></div></div>
    </section>
  </main>
</div>

<script>
let QUESTIONS = [];
let BY_ID = new Map();
const CHAPTERS = { I: "Chương I", II: "Chương II", III: "Chương III", IV: "Chương IV", V: "Chương V", VI: "Chương VI" };
const STORAGE_KEY = "gplx-custom-exam-v1";
const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? "").replace(/[&<>\"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;" }[c]));
const normalize = (value) => String(value ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "d").toLowerCase().replace(/\s+/g, " ").trim();
let selectedIds = [];
let query = "";
let chapter = "all";
let examIndex = 0;
let answers = {};
let submitted = false;

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
  if (saved && Array.isArray(saved.selectedIds)) selectedIds = saved.selectedIds.map(Number).filter(Number.isInteger);
} catch {}
function persist() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ selectedIds })); } catch {} }
function selectedQuestions() { return selectedIds.map((id) => BY_ID.get(id)).filter(Boolean); }
function matches(q) {
  const chapterMatch = chapter === "all" ? true : chapter === "critical" ? q.critical : q.chapter === chapter;
  if (!chapterMatch) return false;
  const needle = normalize(query).replace(/^cau\s+/, "");
  if (!needle) return true;
  return normalize([q.id, q.prompt, ...q.options.map((o) => o.text)].join(" ")).includes(needle);
}
function renderResults() {
  const all = QUESTIONS.filter(matches);
  const shown = query.trim() || chapter !== "all" ? all : all.slice(0, 30);
  $("#resultsMeta").textContent = query.trim() || chapter !== "all" ? `${all.length} kết quả` : `Hiển thị ${shown.length}/${all.length} câu — hãy tìm theo từ khóa để lọc nhanh hơn`;
  $("#results").innerHTML = shown.length ? shown.map((q) => {
    const added = selectedIds.includes(q.id);
    return `<article class="question-result"><span class="question-no">Câu ${q.id}</span><div class="question-copy"><p>${esc(q.prompt)}${q.critical ? '<span class="critical-badge">CÂU LIỆT</span>' : ""}</p><small>${CHAPTERS[q.chapter] || q.chapter} · ${q.options.length} lựa chọn</small></div><button class="add-btn" type="button" data-action="toggle-add" data-id="${q.id}" aria-pressed="${added}" ${added ? "disabled" : ""}>${added ? "✓ Đã thêm" : "+ Thêm"}</button></article>`;
  }).join("") : '<div class="empty-state"><strong>Không tìm thấy câu phù hợp</strong>Thử từ khóa khác hoặc đổi bộ lọc.</div>';
}
function renderSelection() {
  const selected = selectedQuestions();
  $("#topCount").textContent = `${selected.length} câu`;
  $("#footerCount").textContent = `${selected.length}/600 câu`;
  $("#selectionHint").textContent = selected.length ? "Bạn có thể đổi thứ tự hoặc xóa câu trước khi bắt đầu." : "Chưa có câu nào được thêm.";
  $("#clearBtn").disabled = !selected.length;
  $("#startBtn").disabled = !selected.length;
  $("#selectedList").innerHTML = selected.length ? selected.map((q, i) => `<div class="selected-item"><span class="order">${String(i + 1).padStart(2, "0")}</span><span class="text">Câu ${q.id} · ${esc(q.prompt)}</span><button class="remove-btn" type="button" data-action="remove" data-id="${q.id}" aria-label="Xóa câu ${q.id}">×</button></div>`).join("") : '<div class="empty-state"><strong>Đề thi đang trống</strong>Hãy tìm câu hỏi ở khung bên trái và bấm “+ Thêm”.</div>';
  renderResults();
}
function showNotice(text) { const el = $("#selectionNotice"); el.textContent = text; el.hidden = !text; if (text) setTimeout(() => { if (el.textContent === text) el.hidden = true; }, 2400); }
function addQuestion(id) { if (!selectedIds.includes(id)) { selectedIds.push(id); persist(); renderSelection(); showNotice(`Đã thêm câu ${id} vào đề.`); } }
function removeQuestion(id) { selectedIds = selectedIds.filter((x) => x !== id); persist(); renderSelection(); }
function enterBuilder() { submitted = false; $("#builderView").style.display = "block"; $("#examView").style.display = "none"; $("#resultView").style.display = "none"; renderSelection(); }
function enterExam() { if (!selectedIds.length) return showNotice("Bạn chưa chọn câu nào."); examIndex = 0; answers = {}; submitted = false; $("#builderView").style.display = "none"; $("#examView").style.display = "block"; $("#resultView").style.display = "none"; renderExam(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function renderExam() {
  const selected = selectedQuestions(), q = selected[examIndex];
  if (!q) return enterBuilder();
  $("#examProgress").textContent = `Câu ${examIndex + 1}/${selected.length} · Đã trả lời ${Object.keys(answers).length}`;
  const imgs = q.images?.length ? `<div class="exam-images">${q.images.map((image) => `<img src="${esc(image.file)}" alt="Hình minh họa câu ${q.id}">`).join("")}</div>` : "";
  const options = q.options.map((option) => `<button class="exam-option ${answers[q.id] === option.id ? "selected" : ""}" type="button" data-action="answer" data-id="${option.id}"><b>${option.id}</b><span>${esc(option.text)}</span></button>`).join("");
  $("#examCard").innerHTML = `<div style="margin-bottom:10px;color:var(--text-muted);font:600 .78rem var(--font-mono)">Câu ${q.id} · ${CHAPTERS[q.chapter] || q.chapter}${q.critical ? ' · <span style="color:var(--warn)">CÂU ĐIỂM LIỆT</span>' : ""}</div><h2>${esc(q.prompt)}</h2>${imgs}<div class="exam-options">${options}</div><div class="exam-actions"><button class="ghost-btn" type="button" data-action="exam-prev" ${examIndex === 0 ? "disabled" : ""}>← Câu trước</button>${examIndex === selected.length - 1 ? '<button class="primary-btn" type="button" data-action="submit-exam">Hoàn thành bài thi</button>' : '<button class="primary-btn" type="button" data-action="exam-next">Câu tiếp theo →</button>'}</div>`;
}
function renderResult() {
  const selected = selectedQuestions();
  const correct = selected.filter((q) => answers[q.id] === q.pdf_correct_option).length;
  $("#builderView").style.display = "none"; $("#examView").style.display = "none"; $("#resultView").style.display = "block";
  $("#resultHero").innerHTML = `<h2>Đã hoàn thành bài thi</h2><div class="result-score">${correct}/${selected.length} câu đúng</div><p style="margin:0 0 18px;color:var(--text-muted)">Bạn đã làm xong đề tùy chỉnh gồm ${selected.length} câu.</p><div class="result-actions"><button class="ghost-btn" type="button" id="reviewExamBtn">Xem lại bài</button><button class="primary-btn" type="button" id="editExamBtn">Sửa danh sách câu</button></div>`;
  $("#reviewList").innerHTML = selected.map((q, i) => { const ok = answers[q.id] === q.pdf_correct_option; const answer = answers[q.id] === undefined ? "Chưa trả lời" : `Bạn chọn đáp án ${answers[q.id]}`; return `<div class="review-item ${ok ? "ok" : "bad"}"><strong>Câu ${i + 1} · Câu ${q.id}</strong> — ${ok ? "Đúng" : "Chưa đúng"}. ${answer}; đáp án đúng: ${q.pdf_correct_option}.</div>`; }).join("");
  $("#reviewExamBtn").onclick = () => { submitted = false; examIndex = 0; $("#resultView").style.display = "none"; $("#examView").style.display = "block"; renderExam(); };
  $("#editExamBtn").onclick = enterBuilder;
  window.scrollTo({ top: 0, behavior: "smooth" });
}
document.addEventListener("input", (event) => { if (event.target.id === "questionSearch") { query = event.target.value; renderResults(); } });
document.addEventListener("change", (event) => { if (event.target.id === "chapterFilter") { chapter = event.target.value; renderResults(); } });
document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-action]"); if (!target) return;
  const action = target.dataset.action, id = Number(target.dataset.id);
  if (action === "toggle-add") addQuestion(id);
  else if (action === "remove") removeQuestion(id);
  else if (action === "clear") { selectedIds = []; persist(); renderSelection(); }
  else if (action === "answer") { const q = selectedQuestions()[examIndex]; answers[q.id] = id; renderExam(); }
  else if (action === "exam-prev") { examIndex--; renderExam(); }
  else if (action === "exam-next") { examIndex++; renderExam(); }
  else if (action === "submit-exam") { submitted = true; renderResult(); }
});
$("#clearBtn").dataset.action = "clear";
$("#startBtn").addEventListener("click", enterExam);
$("#backToBuilderBtn").addEventListener("click", enterBuilder);
async function loadQuestions() {
  try {
    const response = await fetch("questions.json", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    QUESTIONS = await response.json();
    BY_ID = new Map(QUESTIONS.map((q) => [q.id, q]));
    selectedIds = selectedIds.filter((id) => BY_ID.has(id));
    enterBuilder();
  } catch (error) {
    $("#resultsMeta").textContent = "Không thể tải bộ câu hỏi.";
    $("#results").innerHTML = `<div class="empty-state"><strong>Không tải được dữ liệu</strong>Mở trang qua web server và thử tải lại. (${esc(error.message)})</div>`;
  }
}
loadQuestions();
</script>
</body>
</html>
